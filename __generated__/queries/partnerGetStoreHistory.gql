query partnerGetStoreHistory(
  $filters: [JSONObject!]
  $isActive: StatusEnum
  $isApproved: Boolean
  $limit: Int
  $page: Int
  $search: String
  $sort: SortInput
  $storeId: String!
  $type: StoreProductTypeEnum!
) {
  partnerGetStoreHistory(
    filters: $filters
    isActive: $isActive
    isApproved: $isApproved
    limit: $limit
    page: $page
    search: $search
    sort: $sort
    storeId: $storeId
    type: $type
  ) {
    items {
      createdAt
      deletedAt
      id
      inputDate
      product {
        avatarId
        createdAt
        deletedAt
        descriptionImageIds
        detail
        id
        isActive
        isFavorite
        isFixedCost
        isNew
        name
        operatingNumber
        operatingUnit
        ordinalNumber
        partNumber
        partnerId
        quantity
        serialNumber
        star
        type
        unitPrice
        updatedAt
        vehicleRegistrationPlate
        vinNumber
        yearOfManufacture
      }
      productId
      quantity
      storeId
      type
      updatedAt
    }
    meta {
      currentPage
      itemCount
      itemsPerPage
      totalItems
      totalPages
    }
  }
}
