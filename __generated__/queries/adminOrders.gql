query adminOrders(
  $endDate: String
  $filters: [JSONObject!]
  $isActive: StatusEnum
  $isApproved: Boolean
  $limit: Int
  $page: Int
  $search: String
  $sort: SortInput
  $startDate: String
  $statuses: [OrderStatusEnum!]
) {
  adminOrders(
    endDate: $endDate
    filters: $filters
    isActive: $isActive
    isApproved: $isApproved
    limit: $limit
    page: $page
    search: $search
    sort: $sort
    startDate: $startDate
    statuses: $statuses
  ) {
    items {
      address {
        addressDetail
        addressName
        contactName
        contactPhone
        createdAt
        deletedAt
        id
        latitude
        longitude
        mapAddress
        updatedAt
      }
      code
      createdAt
      deletedAt
      discount
      id
      note
      partner {
        addressMoreInfo
        avatarId
        bank
        birthday
        canReviewPartner
        cardNumber
        citizenId
        countProduct
        countTechnician
        createdAt
        deletedAt
        description
        email
        fullname
        hotline
        id
        isActive
        isAdmin
        isApproved
        latitude
        longitude
        mapAddress
        menus
        parentId
        phone
        star
        storeStar
        suggestionPoint
        type
        updatedAt
      }
      partnerId
      product {
        avatarId
        canReviewProduct
        createdAt
        deletedAt
        descriptionImageIds
        id
        isNew
        name
        operatingNumber
        operatingUnit
        orderId
        ordinalNumber
        partNumber
        productId
        quantity
        serialNumber
        total
        type
        unitPrice
        updatedAt
        vehicleRegistrationPlate
        vinNumber
        yearOfManufacture
      }
      shippingFee
      status
      statusDetail {
        createdAt
        id
        note
        orderId
        partnerId
        status
        userId
      }
      total
      updatedAt
      user {
        address
        avatarId
        birthday
        certificate
        createdAt
        deletedAt
        email
        fullname
        id
        isActive
        numberBooking
        numberMaintenance
        numberOrder
        phone
        star
        totalBookings
        totalMaintenanceRequests
        totalOrders
        totalPayment
        totalSpending
        updatedAt
      }
      userId
    }
    meta {
      currentPage
      itemCount
      itemsPerPage
      totalItems
      totalPages
    }
  }
}
