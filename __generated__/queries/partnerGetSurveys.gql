query partnerGetSurveys(
  $filters: [JSONObject!]
  $isActive: StatusEnum
  $isApproved: Boolean
  $limit: Int
  $page: Int
  $search: String
  $sort: SortInput
) {
  partnerGetSurveys(
    filters: $filters
    isActive: $isActive
    isApproved: $isApproved
    limit: $limit
    page: $page
    search: $search
    sort: $sort
  ) {
    items {
      createdAt
      deletedAt
      id
      isActive
      name
      partnerIsSubmitSurvey
      partnerResultSurvey {
        createdAt
        deletedAt
        id
        surveyId
        type
        updatedAt
        userId
      }
      questions {
        answerType
        answers
        createdAt
        deletedAt
        id
        isRequired
        question
        surveyId
        updatedAt
      }
      updatedAt
      userIsSubmitSurvey
      userResultSurvey {
        createdAt
        deletedAt
        id
        surveyId
        type
        updatedAt
        userId
      }
    }
    meta {
      currentPage
      itemCount
      itemsPerPage
      totalItems
      totalPages
    }
  }
}
