query adminGetSurveys(
  $endDate: String
  $filters: [JSONObject!]
  $isActive: StatusEnum
  $isApproved: Boolean
  $limit: Int
  $openDate: DateTime
  $page: Int
  $search: String
  $sort: SortInput
  $startDate: String
) {
  adminGetSurveys(
    endDate: $endDate
    filters: $filters
    isActive: $isActive
    isApproved: $isApproved
    limit: $limit
    openDate: $openDate
    page: $page
    search: $search
    sort: $sort
    startDate: $startDate
  ) {
    items {
      createdAt
      deletedAt
      id
      isActive
      name
      partnerIsSubmitSurvey
      partnerResultSurvey {
        createdAt
        deletedAt
        id
        surveyId
        type
        updatedAt
        userId
      }
      questions {
        answerType
        answers
        createdAt
        deletedAt
        id
        isRequired
        question
        surveyId
        updatedAt
      }
      updatedAt
      userIsSubmitSurvey
      userResultSurvey {
        createdAt
        deletedAt
        id
        surveyId
        type
        updatedAt
        userId
      }
    }
    meta {
      currentPage
      itemCount
      itemsPerPage
      totalItems
      totalPages
    }
  }
}
