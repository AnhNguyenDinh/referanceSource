mutation adminUpdateSurvey($input: UpdateSurveyInput!) {
  adminUpdateSurvey(input: $input) {
    createdAt
    deletedAt
    id
    isActive
    name
    partnerIsSubmitSurvey
    partnerResultSurvey {
      createdAt
      deletedAt
      id
      results {
        answer
        questionId
      }
      surveyId
      type
      updatedAt
      userId
    }
    questions {
      answerType
      answers
      createdAt
      deletedAt
      id
      isRequired
      question
      surveyId
      updatedAt
    }
    updatedAt
    userIsSubmitSurvey
    userResultSurvey {
      createdAt
      deletedAt
      id
      results {
        answer
        questionId
      }
      surveyId
      type
      updatedAt
      userId
    }
  }
}
