mutation createMaintenance($input: CreateMaintenanceInput!) {
  createMaintenance(input: $input) {
    accessories {
      accessoryId
      createdAt
      id
      isAvailable
      maintenanceId
      name
      quantity
      unit
    }
    addressMoreInfo
    code
    createdAt
    deletedAt
    endDate
    id
    isActive
    latitude
    longitude
    maintenanceLevel
    mapAddress
    note
    routineLevel
    startDate
    status
    statusDetail {
      createdAt
      id
      maintenanceId
      note
      reasons {
        createdAt
        id
        maintenanceStatusId
        name
        type
      }
      status
      userId
    }
    updatedAt
    user {
      address
      avatar {
        createdAt
        fileSize
        fullOriginalUrl
        fullThumbUrl
        id
        isDeleted
        mimeType
        name
        originalUrl
        ownerId
        thumbUrl
        type
        updatedAt
        videoUrl
      }
      avatarId
      birthday
      certificate
      createdAt
      deletedAt
      email
      fullname
      id
      isActive
      numberBooking
      numberMaintenance
      numberOrder
      phone
      star
      totalBookings
      totalMaintenanceRequests
      totalOrders
      totalPayment
      totalSpending
      updatedAt
      userAddress {
        addressDetail
        addressName
        contactName
        contactPhone
        createdAt
        deletedAt
        id
        isDefault
        latitude
        longitude
        mapAddress
        updatedAt
        userId
      }
    }
    userId
    vehicle {
      addressMoreInfo
      avatar {
        createdAt
        fileSize
        fullOriginalUrl
        fullThumbUrl
        id
        isDeleted
        mimeType
        name
        originalUrl
        ownerId
        thumbUrl
        type
        updatedAt
        videoUrl
      }
      avatarId
      createdAt
      deletedAt
      detail
      hidden
      id
      latitude
      longitude
      manufacturer {
        createdAt
        deletedAt
        id
        isActive
        name
        type
        updatedAt
      }
      mapAddress
      model {
        createdAt
        deletedAt
        id
        isActive
        name
        type
        updatedAt
      }
      name
      operatingNumber
      operatingUnit
      ordinalNumber
      origin {
        createdAt
        deletedAt
        id
        isActive
        name
        type
        updatedAt
      }
      serialNumber
      updatedAt
      userId
      vehicleRegistrationPlate
      vehicleType {
        createdAt
        deletedAt
        id
        isActive
        name
        type
        updatedAt
      }
      vinNumber
      yearOfManufacture
    }
    vehicleId
  }
}
