mutation adminUpdateInstruction($input: UpdateInstructionInput!) {
  adminUpdateInstruction(input: $input) {
    createdAt
    deletedAt
    description
    guide {
      createdAt
      deletedAt
      description
      id
      instructions {
        createdAt
        deletedAt
        description
        guideId
        id
        isActive
        name
        updatedAt
      }
      isActive
      name
      updatedAt
    }
    guideId
    id
    isActive
    name
    updatedAt
  }
}
